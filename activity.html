<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body><title>Shoreline Analytics Activity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout concept: swimlanes drawn as bands of a survey sheet. Time runs left to right inside a lane and
     each hand-over drops to the lane below. A key diamond walks the happy path forever; the two ways to fail
     (stop, roll back) are the only exits. */
  :root {
    --paper: #F0F4F3; --surface: #FAFCFB; --sea: #D8E7EA; --ink: #0E2A33; --ink2: #4A6670; --line: #8AA3AA; --mag: #B01E63;
    --band: rgba(216, 231, 234, .45);
    --f-head: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #091317; --surface: #0E1D23; --sea: #15333D; --ink: #D5E7EB; --ink2: #8DA6AE; --line: #3C5A64; --mag: #FF6FA8; --band: rgba(21, 51, 61, .55); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #091317; --surface: #0E1D23; --sea: #15333D; --ink: #D5E7EB; --ink2: #8DA6AE; --line: #3C5A64; --mag: #FF6FA8; --band: rgba(21, 51, 61, .55); color-scheme: dark; }

  body { background: var(--paper); color: var(--ink); font-family: var(--f-mono); font-size: 12px; line-height: 1.5;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 26px 30px; }
  .wrap { max-width: 1190px; margin: 0 auto; }
  .sheet { position: relative; border: 1px solid var(--ink); padding: 26px 26px 22px; }
  .sheet::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--ink); pointer-events: none; }
  .tk { position: absolute; pointer-events: none; }
  .tk.t, .tk.b { left: 0; right: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 40px); }
  .tk.l, .tk.r { top: 0; bottom: 0; width: 6px; background: repeating-linear-gradient(0deg, var(--ink) 0 1px, transparent 1px 40px); }
  .tk.t { top: 0; } .tk.b { bottom: 0; } .tk.l { left: 0; } .tk.r { right: 0; }

  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 24px; flex-wrap: wrap; margin: 0 4px 14px; }
  .k { font-family: var(--f-head); font-weight: 500; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); margin: 0 0 4px; }
  h1 { font-family: var(--f-head); font-weight: 600; font-size: 44px; line-height: .95; letter-spacing: .01em; text-transform: uppercase; margin: 0; }
  .lgd { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink2); font-size: 11px; align-items: center; }
  .lgd span { display: inline-flex; align-items: center; gap: 7px; }

  .scroller { overflow-x: auto; overflow-y: hidden; }
  .fit { position: relative; }
  .stage { position: relative; width: 1120px; height: 700px; transform-origin: 0 0; }
  svg.dia { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  .band { fill: var(--band); }
  .band.alt { fill: transparent; }
  .lane-line { stroke: var(--line); stroke-width: 1; }
  .lane-lab { font-family: var(--f-head); font-weight: 500; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; fill: var(--ink2); }
  .lane-box { fill: none; stroke: var(--ink); stroke-width: 1.25; }

  .edge { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
  .edge.fail { stroke: var(--ink2); stroke-dasharray: 5 4; }
  .ah { fill: var(--ink); }
  .edge-g.fail .ah { fill: var(--ink2); }
  .etxt { font-family: var(--f-mono); font-size: 10px; fill: var(--ink2); }
  .etxt.bg { paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }

  .act { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; }
  .act-in { fill: none; stroke: var(--line); stroke-width: 1; }
  .dec { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; }
  .ntxt { font-family: var(--f-mono); font-size: 10.5px; fill: var(--ink); text-anchor: middle; }
  .nno { font-family: var(--f-head); font-weight: 600; font-size: 12px; letter-spacing: .08em; fill: var(--ink2); }
  .start { fill: var(--ink); }
  .endr { fill: var(--surface); stroke: var(--ink); stroke-width: 1.4; }
  .endd { fill: var(--ink); }
  .stop { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.4; }
  .stopx { stroke: var(--ink2); stroke-width: 1.4; }
  .node { cursor: pointer; }
  .node:focus-visible { outline: none; }
  .node:focus-visible .act, .node:focus-visible .dec { stroke: var(--mag); stroke-width: 2.4; }
  .node.sel .act, .node.sel .dec, .node.sel .endr, .node.sel .stop { stroke: var(--mag); stroke-width: 2.2; }
  .node.sel .act { fill: var(--sea); }
  .node:hover .act, .node:hover .dec { stroke: var(--mag); }
  .stage.focus .node:not(.sel) { opacity: .45; }
  .stage.focus .edge-g { opacity: .35; }
  .node, .edge-g { transition: opacity .15s; }
  .token { fill: var(--mag); }

  .info { margin: 12px 4px 0; padding: 12px 16px; border: 1px solid var(--ink); background: var(--surface); position: relative; min-height: 76px; display: grid; grid-template-columns: 170px 1fr; gap: 4px 20px; align-items: start; }
  .info::after { content: ""; position: absolute; inset: 3px; border: 1px solid var(--line); pointer-events: none; }
  .info .st { font-family: var(--f-head); font-weight: 600; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; line-height: 1.05; }
  .info .tx { color: var(--ink); font-size: 12.5px; line-height: 1.55; }
  .info .ln { font-family: var(--f-head); font-weight: 500; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); grid-column: 1; }
  @media (max-width: 720px) { .info { grid-template-columns: 1fr; } h1 { font-size: 34px; } }

  .geo { margin: 10px 2px 0; font-size: 10.5px; color: var(--ink2); letter-spacing: .04em; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .replay { all: unset; cursor: pointer; color: var(--ink2); }
  .replay:hover { color: var(--mag); text-decoration: underline; }
  .replay:focus-visible { outline: 2px solid var(--mag); outline-offset: 2px; }

  /* intro: lanes slide in, then every step and arrow appears in the order of the process */
  .stage.intro .band, .stage.intro .lane-lab { animation: fadein .6s ease-out backwards; }
  .stage.intro .node { animation: pop .5s cubic-bezier(.2,.7,.2,1) var(--d, 0s) backwards; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { opacity: 0; transform: scale(.9); } }
  .stage.intro .edge-g .edge { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw .45s ease-out var(--d, 0s) backwards; }
  .stage.intro .edge-g .ah, .stage.intro .edge-g .etxt { animation: fadein .3s ease-out var(--d, 0s) backwards; }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  @keyframes fadein { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .token { display: none; } }
</style>

<div class="wrap">
  <figure style="margin:0">
    <div class="sheet">
      <i class="tk t"></i><i class="tk b"></i><i class="tk l"></i><i class="tk r"></i>
      <div class="head">
        <div><p class="k">Alexandria coast · 2018–2026</p><h1>From scenes to risk</h1></div>
        <div class="lgd">
          <span><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="var(--ink)"/></svg>start</span>
          <span><svg width="28" height="16" viewBox="0 0 28 16"><rect x="1" y="2" width="26" height="12" fill="none" stroke="var(--ink)" stroke-width="1.4"/></svg>step</span>
          <span><svg width="18" height="16" viewBox="0 0 18 16"><path d="M9 1 17 8 9 15 1 8Z" fill="none" stroke="var(--ink)" stroke-width="1.4"/></svg>decision</span>
          <span><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--ink2)" stroke-width="1.4"/><path d="M4.5 4.5 9.5 9.5M9.5 4.5 4.5 9.5" stroke="var(--ink2)" stroke-width="1.4"/></svg>stop</span>
        </div>
      </div>
      <div class="scroller" id="scroller">
        <div class="fit" id="fit">
          <div class="stage" id="stage">
            <svg class="dia" id="dia" viewBox="0 0 1120 700" role="img" aria-label="Activity diagram in five lanes: the remote-sensing team hands over shoreline files, the loader checks and loads them in one transaction, the erosion script measures change, PostGIS assigns risk and confidence, and the dashboard shows the result."></svg>
          </div>
        </div>
      </div>
      <div class="info" id="info" aria-live="polite"></div>
    </div>
    <figcaption class="geo"><span>Select a step to read what it does · Esc clears</span><button class="replay" id="replay" type="button">↻ Replay</button></figcaption>
  </figure>
</div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var X0 = 116, DX = 132;
  function X(c) { return X0 + (c - 1) * DX; }
  var LANES = [
    { name: 'Remote sensing', two: ['Remote','sensing'], y0: 0, y1: 130, cy: 65 },
    { name: 'Loader script', two: ['Loader','script'], y0: 130, y1: 300, cy: 192 },
    { name: 'Erosion script', two: ['Erosion','script'], y0: 300, y1: 430, cy: 365 },
    { name: 'PostGIS (SQL)', two: ['PostGIS','(SQL)'], y0: 430, y1: 560, cy: 495 },
    { name: 'API and dashboard', two: ['API and','dashboard'], y0: 560, y1: 690, cy: 625 }
  ];
  var BRANCH_Y = 268;

  /* kind: start | act | dec | end | stop. n = step number on the happy path. */
  var NODES = [
    { id: 'S',  kind: 'start', c: 1, lane: 0, title: 'Start', desc: 'The remote-sensing team starts from the Sentinel-2 archive on Microsoft Planetary Computer.' },
    { id: 'A1', kind: 'act', c: 2, lane: 0, n: 1, lines: ['Download', 'Sentinel-2', 'scenes'], title: 'Download scenes', desc: 'Searches for one scene under 10% cloud for each summer, 2018 to 2026, and saves bands B03 (Green) and B08 (NIR).' },
    { id: 'A2', kind: 'act', c: 3, lane: 0, n: 2, lines: ['Compute NDWI,', 'mask water,', 'trace shorelines'], title: 'Trace shorelines', desc: 'NDWI = (Green − NIR) / (Green + NIR). Pixels above 0.0 count as water. The shoreline is traced along the water edge. Precision is about 10 m.' },
    { id: 'A3', kind: 'act', c: 4, lane: 0, n: 3, lines: ['Cut into', 'sectors, write', 'two GeoPackages'], title: 'Hand over files', desc: 'The shoreline is cut into three sectors and written to two GeoPackage files: the sectors, and 215 shoreline segments.' },
    { id: 'B1', kind: 'act', c: 4, lane: 1, n: 4, lines: ['Read the two', 'GeoPackage files'], title: 'Read the files', desc: 'load_shorelines.py opens sectors.gpkg and the ANALYSIS shoreline file. Nothing touches the database yet.' },
    { id: 'D1', kind: 'dec', c: 5, lane: 1, n: 5, lines: ['Files', 'valid?'], title: 'Files valid?', desc: 'The CRS must be EPSG:32636, geometry types must be right, there must be no Z value and every geometry must be valid.' },
    { id: 'E1', kind: 'stop', c: 5, lane: 1, branch: true, label: 'Stop, show error', title: 'Stop', desc: 'The script stops with a clear message. The database is untouched.' },
    { id: 'B2', kind: 'act', c: 6, lane: 1, n: 6, lines: ['Load sectors and', 'segments, one', 'transaction'], title: 'Load in one transaction', desc: 'Inside a single transaction: empty both tables, insert 3 sectors and 215 shoreline segments.' },
    { id: 'D2', kind: 'dec', c: 7, lane: 1, n: 7, lines: ['Counts', 'match?'], title: 'Counts match?', desc: 'There must be 3 sectors and 215 segments: 167 from the original scenes and 48 from the alternative scenes.' },
    { id: 'E2', kind: 'stop', c: 7, lane: 1, branch: true, label: 'Roll back', title: 'Roll back', desc: 'Everything is rolled back. Nothing is saved, so the database never holds half a load.' },
    { id: 'B3', kind: 'act', c: 8, lane: 1, n: 8, lines: ['Commit'], title: 'Commit', desc: 'The transaction is committed. The data is saved.' },
    { id: 'C1', kind: 'act', c: 1, lane: 2, n: 9, lines: ['Sample a point', 'every 50 m on', 'start shoreline'], title: 'Sample points', desc: 'compute_erosion.py reads the same GeoPackage and places a point every 50 m along the start-year shoreline of each sector.' },
    { id: 'C2', kind: 'act', c: 2, lane: 2, n: 10, lines: ['Measure signed', 'distance to the', 'end shoreline'], title: 'Measure change', desc: 'Finds the nearest point on the end-year shoreline. North is seaward (positive), south is landward (negative). Points with no match within 150 m are left out.' },
    { id: 'C3', kind: 'act', c: 3, lane: 2, n: 11, lines: ['Save change,', 'rate and', 'uncertainty'], title: 'Save erosion rates', desc: 'Mean change, rate in metres per year and uncertainty (one pixel per shoreline) go into erosion_rates, in one transaction.' },
    { id: 'F1', kind: 'act', c: 3, lane: 3, n: 12, lines: ['Apply the risk', 'limits: pick a', 'Risk Class'], title: 'Pick the Risk Class', desc: 'shoreline.assess_risk() matches each rate to a row of risk_thresholds: very low, low, moderate, high or very high.' },
    { id: 'F2', kind: 'act', c: 4, lane: 3, n: 13, lines: ['Compute the', 'Confidence', 'Score (0 to 1)'], title: 'Compute the Confidence Score', desc: 'A weighted average of class probability, coverage, source consistency and data quality, with a penalty for periods that touch 2024. The weights live in confidence_parameters.' },
    { id: 'F3', kind: 'act', c: 5, lane: 3, n: 14, lines: ['Save', 'risk_assessments'], title: 'Save the assessments', desc: 'One Risk Class and one Confidence Score per erosion rate are written to risk_assessments.' },
    { id: 'G1', kind: 'act', c: 5, lane: 4, n: 15, lines: ['Read', 'v_erosion_risk'], title: 'Read the view', desc: 'The Flask API reads the view v_erosion_risk: one readable row per sector and period.' },
    { id: 'G2', kind: 'act', c: 6, lane: 4, n: 16, lines: ['Show map, risk', 'and confidence'], title: 'Show the result', desc: 'The Streamlit map shows the risk class and the confidence for each sector and period.' },
    { id: 'G3', kind: 'end', c: 7, lane: 4, title: 'End', desc: 'The user sees where the Alexandria shoreline is eroding, and how sure we are.' }
  ];

  /* from, to, kind: h (right to left side), v (bottom to top), or pts; label; fail */
  var EDGES = [
    { a: 'S', b: 'A1', m: 'h' }, { a: 'A1', b: 'A2', m: 'h' }, { a: 'A2', b: 'A3', m: 'h' },
    { a: 'A3', b: 'B1', m: 'v' },
    { a: 'B1', b: 'D1', m: 'h' },
    { a: 'D1', b: 'B2', m: 'h', label: 'yes' },
    { a: 'D1', b: 'E1', m: 'v', label: 'no', fail: 1 },
    { a: 'B2', b: 'D2', m: 'h' },
    { a: 'D2', b: 'B3', m: 'h', label: 'yes' },
    { a: 'D2', b: 'E2', m: 'v', label: 'no', fail: 1 },
    { a: 'B3', b: 'C1', m: 'ret', label: 'files loaded' },
    { a: 'C1', b: 'C2', m: 'h' }, { a: 'C2', b: 'C3', m: 'h' },
    { a: 'C3', b: 'F1', m: 'v' },
    { a: 'F1', b: 'F2', m: 'h' }, { a: 'F2', b: 'F3', m: 'h' },
    { a: 'F3', b: 'G1', m: 'v' },
    { a: 'G1', b: 'G2', m: 'h' }, { a: 'G2', b: 'G3', m: 'h' }
  ];
  var MAIN = ['S','A1','A2','A3','B1','D1','B2','D2','B3','C1','C2','C3','F1','F2','F3','G1','G2','G3'];

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage'), dia = document.getElementById('dia'), info = document.getElementById('info');
  var N = {}, nodeEl = {}, sel = null, order = [];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

  /* ---------- lanes ---------- */
  var gl = el('g', {}, dia);
  LANES.forEach(function (L, i) {
    el('rect', { class: 'band' + (i % 2 ? ' alt' : ''), x: 0, y: L.y0, width: 1120, height: L.y1 - L.y0 }, gl);
    if (i > 0) el('line', { class: 'lane-line', x1: 0, y1: L.y0, x2: 1120, y2: L.y0 }, gl);
    var t = el('text', { class: 'lane-lab', transform: 'translate(19,' + L.cy + ') rotate(-90)', 'text-anchor': 'middle' }, gl);
    L.two.forEach(function (w, k) { var sp = el('tspan', { x: 0, dy: k ? 14 : 0 }, t); sp.textContent = w; });
  });
  el('rect', { class: 'lane-box', x: 0.6, y: 0.6, width: 1118.8, height: 688.8 }, gl);
  el('line', { class: 'lane-line', x1: 44, y1: 0, x2: 44, y2: 690 }, gl);

  /* ---------- geometry ---------- */
  function pos(n) {
    var y = n.branch ? BRANCH_Y : LANES[n.lane].cy;
    if (n.kind === 'stop' || n.kind === 'start' || n.kind === 'end') { n.hw = n.hh = 11; }
    else if (n.kind === 'dec') { n.hw = 56; n.hh = 38; }
    else { n.hw = 56; n.hh = 28; }
    n.x = X(n.c); n.y = y;
  }
  NODES.forEach(function (n) { N[n.id] = n; pos(n); });
  function port(n, s) {
    if (s === 'l') return [n.x - n.hw, n.y];
    if (s === 'r') return [n.x + n.hw, n.y];
    if (s === 't') return [n.x, n.y - n.hh];
    return [n.x, n.y + n.hh];
  }

  /* ---------- edges ---------- */
  var gEdges = el('g', {}, dia);
  var tokenPts = [];
  EDGES.forEach(function (e, i) {
    var A = N[e.a], B = N[e.b], pts;
    if (e.m === 'h') pts = [port(A, 'r'), port(B, 'l')];
    else if (e.m === 'v') pts = [port(A, 'b'), port(B, 't')];
    else pts = [[A.x, A.y + A.hh], [A.x, 318], [B.x, 318], [B.x, B.y - B.hh]];
    e.pts = pts;
    var d = 'M' + pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' L');
    var q = pts[pts.length - 1], p0 = pts[pts.length - 2];
    var dx = q[0] - p0[0], dy = q[1] - p0[1], l = Math.hypot(dx, dy), ux = dx / l, uy = dy / l;
    var g = el('g', { class: 'edge-g' + (e.fail ? ' fail' : '') }, gEdges);
    el('path', { class: 'edge' + (e.fail ? ' fail' : ''), d: d, pathLength: 1 }, g);
    el('path', { class: 'ah', d: 'M' + q[0] + ',' + q[1] + ' L' + (q[0] - ux * 9 - uy * 4.5) + ',' + (q[1] - uy * 9 + ux * 4.5) + ' L' + (q[0] - ux * 9 + uy * 4.5) + ',' + (q[1] - uy * 9 - ux * 4.5) + 'Z' }, g);
    if (e.label) {
      var mx, my, anchor = 'middle';
      if (e.m === 'h') { mx = (pts[0][0] + q[0]) / 2; my = pts[0][1] - 6; }
      else if (e.m === 'v') { mx = pts[0][0] + 8; my = (pts[0][1] + q[1]) / 2 + 3; anchor = 'start'; }
      else { mx = 560; my = 312; }
      var t = el('text', { class: 'etxt bg', x: mx, y: my, 'text-anchor': anchor }, g); t.textContent = e.label;
    }
    e.g = g;
  });

  /* ---------- nodes ---------- */
  var gNodes = el('g', {}, dia);
  NODES.forEach(function (n) {
    var g = el('g', { class: 'node', tabindex: 0, role: 'button', 'aria-label': n.title, 'data-id': n.id }, gNodes);
    if (n.kind === 'start') el('circle', { class: 'start', cx: n.x, cy: n.y, r: n.hw }, g);
    else if (n.kind === 'end') { el('circle', { class: 'endr', cx: n.x, cy: n.y, r: n.hw }, g); el('circle', { class: 'endd', cx: n.x, cy: n.y, r: 6 }, g); }
    else if (n.kind === 'stop') {
      el('circle', { class: 'stop', cx: n.x, cy: n.y, r: n.hw }, g);
      el('path', { class: 'stopx', d: 'M' + (n.x - 4.5) + ',' + (n.y - 4.5) + ' L' + (n.x + 4.5) + ',' + (n.y + 4.5) + ' M' + (n.x + 4.5) + ',' + (n.y - 4.5) + ' L' + (n.x - 4.5) + ',' + (n.y + 4.5) }, g);
      var lt = el('text', { class: 'etxt', x: n.x + 18, y: n.y + 3.5 }, g); lt.textContent = n.label;
    } else if (n.kind === 'dec') {
      el('path', { class: 'dec', d: 'M' + n.x + ',' + (n.y - n.hh) + ' L' + (n.x + n.hw) + ',' + n.y + ' L' + n.x + ',' + (n.y + n.hh) + ' L' + (n.x - n.hw) + ',' + n.y + 'Z' }, g);
    } else {
      el('rect', { class: 'act', x: n.x - n.hw, y: n.y - n.hh, width: n.hw * 2, height: n.hh * 2 }, g);
      el('rect', { class: 'act-in', x: n.x - n.hw + 4, y: n.y - n.hh + 4, width: n.hw * 2 - 8, height: n.hh * 2 - 8 }, g);
    }
    if (n.lines) {
      var lh = 13.5, y0 = n.y - (n.lines.length - 1) * lh / 2 + 4;
      var t = el('text', { class: 'ntxt', x: n.x, y: y0 }, g);
      n.lines.forEach(function (ln, i) { var s = el('tspan', { x: n.x, dy: i ? lh : 0 }, t); s.textContent = ln; });
    }
    if (n.n) { var no = el('text', { class: 'nno', x: n.x - n.hw + 7, y: n.y - n.hh - 4 }, g); no.textContent = n.n; }
    g.addEventListener('click', function (e) { e.stopPropagation(); pick(n.id); });
    g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(n.id); } });
    n.g = g; nodeEl[n.id] = g;
  });

  /* order of appearance = order of the process; branches appear with their decision */
  var seq = MAIN.slice();
  seq.splice(seq.indexOf('D1') + 1, 0, 'E1'); seq.splice(seq.indexOf('D2') + 1, 0, 'E2');
  seq.forEach(function (id, i) {
    var d = (0.15 + i * 0.16).toFixed(2) + 's';
    N[id].g.style.setProperty('--d', d);
    EDGES.forEach(function (e) { if (e.b === id) e.g.style.setProperty('--d', (0.15 + i * 0.16 - 0.1).toFixed(2) + 's'); });
  });
  var introMs = (0.15 + seq.length * 0.16) * 1000 + 800;

  /* ---------- token on the happy path ---------- */
  var tokenPath = '', tlen = 0;
  (function () {
    var main = [];
    EDGES.filter(function (e) { return !e.fail; }).forEach(function (e) { main.push(e); });
    main.forEach(function (e, i) {
      tokenPath += (i ? ' ' : '') + 'M' + e.pts.map(function (p) { return p[0] + ',' + p[1]; }).join(' L');
      for (var k = 1; k < e.pts.length; k++) tlen += Math.hypot(e.pts[k][0] - e.pts[k - 1][0], e.pts[k][1] - e.pts[k - 1][1]);
    });
  })();
  var token = null;
  function startToken(delay) {
    if (reduce) return;
    if (token) { token.remove(); token = null; }
    token = el('path', { class: 'token', opacity: 0, d: 'M0,-4.5 4.5,0 0,4.5 -4.5,0Z' }, dia);
    var dur = (tlen / 110).toFixed(1) + 's';
    var m = el('animateMotion', { id: 'tm', dur: dur, begin: 'indefinite', repeatCount: 'indefinite', rotate: 0, path: tokenPath }, token);
    el('animate', { attributeName: 'opacity', values: '0;1;1;0', keyTimes: '0;.01;.99;1', dur: dur, begin: 'tm.begin', repeatCount: 'indefinite' }, token);
    setTimeout(function () { try { m.beginElement(); } catch (e) {} }, delay);
  }

  /* ---------- selection ---------- */
  function overview() {
    info.innerHTML = '<div class="st">Five lanes,<br>sixteen steps</div><div class="tx">Data moves from the satellite scenes to a risk map. The key diamond walks the normal path. The loader has two ways to fail, and both leave the database untouched.</div>';
  }
  function pick(id) {
    if (sel === id) { clear(); return; }
    sel = id;
    Object.keys(nodeEl).forEach(function (k) { nodeEl[k].classList.toggle('sel', k === id); });
    stage.classList.add('focus');
    var n = N[id];
    info.innerHTML = '<div class="st">' + (n.n ? 'Step ' + n.n + '<br>' : '') + esc(n.title) + '</div><div class="tx"><span style="display:block;margin-bottom:6px;font-family:var(--f-head);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);font-size:12.5px">' + esc(LANES[n.lane].name) + '</span>' + esc(n.desc) + '</div>';
  }
  function clear() {
    sel = null; stage.classList.remove('focus');
    Object.keys(nodeEl).forEach(function (k) { nodeEl[k].classList.remove('sel'); });
    overview();
  }
  document.getElementById('scroller').addEventListener('click', clear);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') clear(); });

  var introEnd = 0;
  function play() {
    clearTimeout(introEnd);
    if (reduce) { startToken(0); return; }
    stage.classList.remove('intro'); void stage.offsetWidth; stage.classList.add('intro');
    startToken(introMs);
    introEnd = setTimeout(function () { stage.classList.remove('intro'); }, introMs + 200);
  }
  document.getElementById('replay').addEventListener('click', function () { clear(); play(); });

  var scroller = document.getElementById('scroller'), fit = document.getElementById('fit');
  function resize() {
    var avail = scroller.clientWidth, k = avail >= 1120 ? 1 : Math.max(avail / 1120, 0.57);
    stage.style.transform = k < 1 ? 'scale(' + k + ')' : 'none';
    fit.style.width = (1120 * k) + 'px'; fit.style.height = (700 * k) + 'px';
  }
  overview(); resize(); play();
  window.addEventListener('resize', resize);
})();
</script>
</body></html>
