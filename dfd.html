<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body><title>Shoreline Analytics DFD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout concept: the same hydrographic survey sheet as the ER diagram. Data is the thing being surveyed:
     solid outlines are in place, dashed outlines are not finished, and key diamonds travel only along flows
     that carry data today. Chart-magenta marks the sounding line, the diamonds and the selection. */
  :root {
    --paper: #F0F4F3;
    --surface: #FAFCFB;
    --sea: #D8E7EA;
    --ink: #0E2A33;
    --ink2: #4A6670;
    --line: #8AA3AA;
    --mag: #B01E63;
    --f-head: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #091317; --surface: #0E1D23; --sea: #15333D; --ink: #D5E7EB; --ink2: #8DA6AE; --line: #3C5A64; --mag: #FF6FA8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #091317; --surface: #0E1D23; --sea: #15333D; --ink: #D5E7EB; --ink2: #8DA6AE; --line: #3C5A64; --mag: #FF6FA8;
    color-scheme: dark;
  }

  body { background: var(--paper); color: var(--ink); font-family: var(--f-mono); font-size: 12px; line-height: 1.5;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         padding-block: 26px 30px; }
  .wrap { max-width: 1190px; margin: 0 auto; }

  .sheet { position: relative; border: 1px solid var(--ink); padding: 26px 26px 22px; }
  .sheet::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--ink); pointer-events: none; }
  .tk { position: absolute; pointer-events: none; }
  .tk.t, .tk.b { left: 0; right: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 40px); }
  .tk.l, .tk.r { top: 0; bottom: 0; width: 6px; background: repeating-linear-gradient(0deg, var(--ink) 0 1px, transparent 1px 40px); }
  .tk.t { top: 0; } .tk.b { bottom: 0; } .tk.l { left: 0; } .tk.r { right: 0; }

  .scroller { overflow-x: auto; overflow-y: hidden; }
  .fit { position: relative; }
  .stage { position: relative; width: 1120px; height: 780px; transform-origin: 0 0; }

  svg.bathy { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
  .bathy g { animation: drift var(--s, 50s) linear infinite; }
  .bathy path { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 1 5; stroke-linecap: round; opacity: .7; }
  .bathy path.ix { stroke-dasharray: none; stroke-width: .8; opacity: .3; }
  @keyframes drift { to { transform: translateX(-360px); } }

  svg.links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .links path.fl { fill: none; stroke: var(--ink2); stroke-width: 1.5; }
  .links g.pend path.fl { stroke-dasharray: 5 4; }
  .links .hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
  .links .ah { fill: var(--ink2); }
  .links g { transition: opacity .15s; }
  .links g.on path.fl, .links g:hover path.fl { stroke: var(--mag); stroke-width: 2; }
  .links g.on .ah, .links g:hover .ah { fill: var(--mag); }
  .links .pt { fill: var(--mag); }
  .stage.focus .links g:not(.on) { opacity: .25; }

  .ftag { position: absolute; box-sizing: border-box; width: 26px; height: 17px; display: grid; place-items: center; background: var(--paper);
          border: 1px solid var(--ink2); font-size: 9.5px; letter-spacing: .02em; color: var(--ink2); cursor: pointer; padding: 0; font-family: var(--f-mono); z-index: 3; transition: opacity .15s, border-color .12s, color .12s; }
  .ftag.pend { border-style: dashed; }
  .ftag:hover, .ftag.on { border-color: var(--mag); color: var(--mag); }
  .stage.focus .ftag:not(.on) { opacity: .3; }

  .node { position: absolute; box-sizing: border-box; background: var(--surface); border: 1.25px solid var(--ink); cursor: pointer;
          transition: opacity .15s, box-shadow .18s; z-index: 2; }
  .node.pend { border-style: dashed; border-color: var(--ink2); }
  .node.sel { border-color: var(--mag); box-shadow: 5px 5px 0 var(--sea); }
  .stage.focus .node:not(.sel):not(.rel) { opacity: .4; }
  .node:focus-visible, .ftag:focus-visible, .btn:focus-visible, .replay:focus-visible { outline: 2px solid var(--mag); outline-offset: 2px; }
  .nh { height: 26px; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; background: var(--sea); border-bottom: 1.25px solid var(--ink);
        font-family: var(--f-head); font-weight: 500; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .pend .nh { background: transparent; border-bottom: 1.25px dashed var(--ink2); color: var(--ink2); }
  .nh .ow { color: var(--ink2); }
  .nb { padding: 10px 10px 8px; }
  .nt { font-weight: 500; font-size: 13px; line-height: 1.3; }
  .ns { font-size: 10.5px; color: var(--ink2); margin-top: 5px; line-height: 1.35; }
  .st { display: inline-flex; align-items: center; gap: 6px; }
  .st::before { content: ""; width: 5px; height: 5px; border: 1px solid currentColor; border-radius: 50%; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { background: currentColor; } }

  .node.ext { outline: 1px solid var(--line); outline-offset: -6px; display: flex; flex-direction: column; justify-content: center; padding: 0 14px; }
  .node.ext .nt { font-size: 13px; }
  .node.store { border-right: 0; display: flex; }
  .node.store .sid { flex: 0 0 34px; background: var(--sea); border-right: 1.25px solid var(--ink); display: grid; place-items: center; font-family: var(--f-head); font-weight: 500; font-size: 15px; letter-spacing: .06em; }
  .node.store.pend .sid { border-right-style: dashed; }
  .node.store .sb { padding: 12px 12px; min-width: 0; flex: 1; }
  .node.store::after { content: ""; position: absolute; right: 0; top: -1.25px; bottom: -1.25px; width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px solid var(--ink); padding: 1px 7px; font-size: 10px; background: var(--paper); }
  .chip.p { border-style: dashed; border-color: var(--ink2); color: var(--ink2); }

  .insp { position: absolute; left: 0; top: 210px; width: 380px; height: 480px; box-sizing: border-box; background: var(--surface);
          border: 1.25px solid var(--ink); padding: 20px 20px 16px; overflow: auto; z-index: 4; }
  .insp.tour { display: flex; flex-direction: column; }
  .insp::after { content: ""; position: absolute; inset: 4px; border: 1px solid var(--line); pointer-events: none; }
  .k { font-family: var(--f-head); font-weight: 500; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); margin: 0 0 8px; }
  .insp h1 { font-family: var(--f-head); font-weight: 600; font-size: 52px; line-height: .95; letter-spacing: .01em; text-transform: uppercase; margin: 0 0 14px; }
  .insp h2 { font-weight: 500; font-size: 15px; margin: 0 0 8px; }
  .insp p { margin: 0 0 10px; color: var(--ink2); }
  .insp .s { font-family: var(--f-head); font-weight: 500; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin: 0; }
  .insp hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0 14px; }
  .insp h3 { font-family: var(--f-head); font-weight: 500; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); margin: 10px 0 4px; }
  .insp ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  .insp li { padding-left: 14px; position: relative; font-size: 11.5px; }
  .insp li::before { content: ""; position: absolute; left: 1px; top: .55em; width: 5px; height: 5px; border: 1px solid var(--ink2); transform: rotate(45deg); }
  .insp li b { font-weight: 500; color: var(--mag); }
  .back { all: unset; cursor: pointer; font-size: 11px; color: var(--mag); display: inline-block; margin-bottom: 10px; }
  .back:hover { text-decoration: underline; }
  .cap { color: var(--ink) !important; font-size: 13px; line-height: 1.5; }
  .arrow { display: flex; align-items: center; gap: 8px; margin: 2px 0 10px; font-size: 12px; }
  .arrow span { border: 1px solid var(--ink); padding: 1px 7px; background: var(--paper); }

  .btn { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--ink); padding: 4px 10px; font-size: 11px; letter-spacing: .04em; color: var(--ink); background: var(--surface); transition: background .12s, border-color .12s; }
  .btn:hover { background: var(--sea); border-color: var(--mag); }
  .btn.big { display: inline-flex; align-items: center; gap: 9px; padding: 8px 14px; font-size: 12px; }
  .tc { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .tc .exit { margin-left: auto; }
  .prog { height: 2px; background: var(--line); margin-top: 12px; position: relative; overflow: hidden; }
  .prog i { position: absolute; inset: 0; background: var(--mag); transform-origin: 0 50%; animation: fill var(--dur, 4.6s) linear both; }
  .prog.paused i { animation-play-state: paused; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .geo { margin: 10px 2px 0; font-size: 10.5px; color: var(--ink2); letter-spacing: .04em; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .lg { display: inline-flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .lg i { display: inline-block; width: 22px; height: 0; border-top: 1.5px solid var(--ink2); vertical-align: middle; margin-right: 6px; }
  .lg i.d { border-top-style: dashed; }
  .replay { all: unset; cursor: pointer; color: var(--ink2); }
  .replay:hover { color: var(--mag); text-decoration: underline; }

  .sweep { position: absolute; top: -14px; bottom: -14px; left: 0; width: 0; border-left: 1px solid var(--mag); opacity: 0; pointer-events: none; z-index: 6; }
  .sweep .ro { position: absolute; top: 22px; right: 7px; font-size: 10.5px; color: var(--mag); background: var(--paper); padding: 0 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .stage.intro .sweep { animation: sweep 1.9s linear .05s both; }
  @keyframes sweep { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 94% { opacity: 1; } 100% { transform: translateX(1120px); opacity: 0; } }
  .stage.intro .node, .stage.intro .insp { animation: wipe .8s cubic-bezier(.2,.7,.2,1) var(--d, 0s) backwards; }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); opacity: 0; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
  .stage.intro .links path.fl:not(.pd) { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw .8s cubic-bezier(.5, 0, .2, 1) var(--fd, 2s) backwards; }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  .stage.intro .links .pd, .stage.intro .links .ah, .stage.intro .ftag { animation: fadein .5s ease-out var(--fd, 2s) backwards; }
  @keyframes fadein { from { opacity: 0; } }
  .stage.intro .bathy { animation: fadein 1.6s ease-out backwards; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .links .pt, .sweep { display: none; }
  }
</style>

<div class="wrap">
  <figure style="margin:0">
    <div class="sheet">
      <i class="tk t"></i><i class="tk b"></i><i class="tk l"></i><i class="tk r"></i>
      <div class="scroller" id="scroller">
        <div class="fit" id="fit">
          <div class="stage" id="stage">
            <svg class="bathy" id="bathy" aria-hidden="true"></svg>
            <svg class="links" id="links" role="img" aria-label="Data flow: Sentinel-2 imagery is ingested, turned into shoreline lines, loaded into the PostGIS database, turned into erosion rates, risk classes and confidence scores, and served to the dashboard user."></svg>
            <aside class="insp" id="insp" aria-live="polite"></aside>
            <div class="sweep" id="sweep" aria-hidden="true"><span class="ro" id="ro">29.885°E</span></div>
          </div>
        </div>
      </div>
    </div>
    <figcaption class="geo">
      <span class="lg"><span><i></i>in place</span><span><i class="d"></i>not finished</span><span>Diamonds move along flows that carry data today</span></span>
      <button class="replay" id="replay" type="button">↻ Replay survey</button>
    </figcaption>
  </figure>
</div>

<script>
(function () {
  /* kind: ext | proc | store. state: '' (in place) or 'pend'. */
  var NODES = [
    { id: 'E1', kind: 'ext', x: 0, y: 50, w: 110, h: 100, title: 'Sentinel-2', sub: 'Planetary Computer',
      what: 'The satellite imagery source: Microsoft Planetary Computer, collection sentinel-2-l2a.' },
    { id: 'P1', kind: 'proc', num: '1.0', owner: 'Asmaa', x: 173, y: 50, w: 150, h: 100, title: 'Ingest imagery',
      what: 'Searches for one Sentinel-2 scene under 10% cloud for each summer, 2018 to 2026, and saves the Green and NIR bands.' },
    { id: 'D1', kind: 'store', num: 'D1', x: 386, y: 50, w: 130, h: 100, title: 'Raw rasters', sub: 'B03 · B08',
      what: 'The Green (B03) and NIR (B08) bands for every year.' },
    { id: 'P2', kind: 'proc', num: '2.0', owner: 'Doha', x: 579, y: 50, w: 150, h: 100, title: 'Extract shorelines',
      what: 'Computes NDWI, separates water from land, traces the shoreline as lines and cuts it into the three sectors. Precision is about 10 m.' },
    { id: 'D2', kind: 'store', num: 'D2', x: 792, y: 50, w: 328, h: 100, title: 'Handoff files', sub: 'GeoPackage · CSV',
      what: 'sectors.gpkg and the ANALYSIS shoreline file (215 segments) handed over by the remote-sensing team.' },
    { id: 'P4', kind: 'proc', num: '4.0', owner: 'Doha', state: 'pend', x: 780, y: 260, w: 150, h: 100, title: 'Compute erosion rate', note: 'In progress',
      what: 'Measures how far the shoreline moved between years. In progress: the 2024 imagery is unclear, so the numbers are being revised.' },
    { id: 'P3', kind: 'proc', num: '3.0', owner: 'Hagar', x: 970, y: 260, w: 150, h: 100, title: 'Load into PostGIS',
      what: 'Checks CRS and geometry, then loads the sectors and 215 shoreline segments in one transaction. Nothing is saved unless the counts match.' },
    { id: 'D3', kind: 'store', num: 'D3', x: 560, y: 470, w: 560, h: 90, title: 'PostGIS · shoreline_db',
      chips: [['sectors', 0], ['shoreline_segments', 0], ['erosion_rates', 1], ['risk_assessments', 1]],
      what: 'The project database: PostgreSQL 17 with PostGIS 3.5, schema shoreline, all geometry in EPSG:32636. Two tables are loaded, two are planned.' },
    { id: 'P5', kind: 'proc', num: '5.0', owner: 'Hagar', state: 'pend', x: 560, y: 640, w: 170, h: 100, title: 'Risk Class and Confidence', note: 'Pending',
      what: 'Turns each erosion rate into a Risk Class and a Confidence Score. The Confidence formula has come from Doha. The Risk thresholds are still to be agreed.' },
    { id: 'P6', kind: 'proc', num: '6.0', owner: 'Shahd · Nourhan', state: 'pend', x: 780, y: 640, w: 190, h: 100, title: 'API and dashboard', note: 'Not connected yet',
      what: 'The Flask API and the Streamlit map read results from the database and show them to the user.' },
    { id: 'E2', kind: 'ext', state: 'pend', x: 1010, y: 640, w: 110, h: 100, title: 'Dashboard user', sub: '',
      what: 'Anyone looking at the coastal erosion map.' }
  ];

  /* a / b: anchor = node, side (l r t b), optional x on a t / b side */
  var FLOWS = [
    { id: 'F1', a: { n: 'E1', s: 'r' }, b: { n: 'P1', s: 'l' }, name: 'Scene search', what: 'STAC query: bounding box 29.8–30.1°E, 31.1–31.3°N, June to August, cloud cover under 10%.' },
    { id: 'F2', a: { n: 'P1', s: 'r' }, b: { n: 'D1', s: 'l' }, name: 'Green and NIR bands', what: 'The B03 and B08 rasters of the chosen scene.' },
    { id: 'F3', a: { n: 'D1', s: 'r' }, b: { n: 'P2', s: 'l' }, name: 'Rasters', what: 'Green and NIR, read back for the NDWI calculation.' },
    { id: 'F4', a: { n: 'P2', s: 'r' }, b: { n: 'D2', s: 'l' }, name: 'Shoreline lines', what: 'Shoreline lines per sector and year, plus the sector polygons.' },
    { id: 'F5', a: { n: 'D2', s: 'b', x: 855 }, b: { n: 'P4', s: 't' }, name: 'Shorelines by year', what: 'The yearly shorelines, to be compared against each other.' },
    { id: 'F6', pend: 1, a: { n: 'P4', s: 'r' }, b: { n: 'P3', s: 'l' }, name: 'Erosion rates', what: 'Erosion rate per sector and period, metres per year. Not final yet.' },
    { id: 'F7', a: { n: 'D2', s: 'b', x: 1045 }, b: { n: 'P3', s: 't' }, name: 'Sectors and shorelines', what: 'sectors.gpkg and the ANALYSIS shoreline file.' },
    { id: 'F8', a: { n: 'P3', s: 'b' }, b: { n: 'D3', s: 't', x: 1045 }, name: 'Load', what: 'INSERT inside one transaction. Row counts are checked before the commit.' },
    { id: 'F9', pend: 1, a: { n: 'D3', s: 'b', x: 620 }, b: { n: 'P5', s: 't', x: 620 }, name: 'Erosion rates', what: 'Erosion rates with their uncertainty.' },
    { id: 'F10', pend: 1, a: { n: 'P5', s: 't', x: 680 }, b: { n: 'D3', s: 'b', x: 680 }, name: 'Risk and confidence', what: 'One Risk Class and one Confidence Score per erosion rate.' },
    { id: 'F11', pend: 1, a: { n: 'D3', s: 'b', x: 880 }, b: { n: 'P6', s: 't', x: 880 }, name: 'Query results', what: 'Sectors, shorelines, erosion rates and risk, read by the API.' },
    { id: 'F12', pend: 1, a: { n: 'P6', s: 'r' }, b: { n: 'E2', s: 'l' }, name: 'Maps and risk', what: 'The map, the risk colours and the confidence shown on the dashboard.' }
  ];

  var TOUR = ['P1', 'P2', 'P3', 'P4', 'P5', 'P6'];
  var STEP_MS = 4600;

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage'), svg = document.getElementById('links'), insp = document.getElementById('insp');
  var N = {}, nodeEl = {}, tagEl = {}, F = {}, state = { sel: null, flow: null };
  var tour = { active: false, i: 0, playing: false, t0: 0, remain: STEP_MS, timer: 0 };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  /* ---------- contours ---------- */
  (function bathy() {
    var el = document.getElementById('bathy'), out = '';
    for (var k = 0; k < 7; k++) {
      var y0 = 50 + k * 112, a1 = 7 + (k % 3) * 3, a2 = 3 + (k % 2) * 2, ph = k * 0.9, d = '';
      for (var x = -360; x <= 1480; x += 10) {
        var y = y0 + a1 * Math.sin(2 * Math.PI * x / 360 + ph) + a2 * Math.sin(2 * Math.PI * x / 180 + ph * 2);
        d += (x === -360 ? 'M' : 'L') + x + ',' + y.toFixed(1);
      }
      out += '<g style="--s:' + (46 + k * 7) + 's"><path' + (k % 3 === 0 ? ' class="ix"' : '') + ' d="' + d + '"/></g>';
    }
    el.setAttribute('viewBox', '0 0 1120 780');
    el.innerHTML = out;
  })();

  /* ---------- nodes ---------- */
  NODES.forEach(function (n, idx) {
    N[n.id] = n;
    var el = document.createElement('div');
    el.className = 'node ' + n.kind + (n.state === 'pend' ? ' pend' : '');
    el.tabIndex = 0; el.setAttribute('role', 'button'); el.setAttribute('aria-label', n.title);
    el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; el.style.width = n.w + 'px'; el.style.height = n.h + 'px';
    var row = n.y < 200 ? 0 : n.y < 400 ? 1 : n.y < 600 ? 2 : 3;
    n.d = Math.max(0, (n.x + n.w * 0.15) / 1120 * 1.9 - 0.15) + row * 0.12;
    el.style.setProperty('--d', n.d.toFixed(2) + 's');
    var html = '';
    if (n.kind === 'proc') {
      html = '<div class="nh"><span>' + n.num + '</span><span class="ow">' + esc(n.owner) + '</span></div>' +
        '<div class="nb"><div class="nt">' + esc(n.title) + '</div>' + (n.note ? '<div class="ns st">' + esc(n.note) + '</div>' : '') + '</div>';
    } else if (n.kind === 'store') {
      html = '<div class="sid">' + n.num + '</div><div class="sb"><div class="nt">' + esc(n.title) + '</div>' +
        (n.sub ? '<div class="ns">' + esc(n.sub) + '</div>' : '') +
        (n.chips ? '<div class="chips">' + n.chips.map(function (c) { return '<span class="chip' + (c[1] ? ' p' : '') + '">' + c[0] + '</span>'; }).join('') + '</div>' : '') + '</div>';
    } else {
      html = '<div class="nt">' + esc(n.title) + '</div>' + (n.sub ? '<div class="ns">' + esc(n.sub) + '</div>' : '');
    }
    el.innerHTML = html;
    el.addEventListener('click', function (e) { e.stopPropagation(); pickNode(n.id); });
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickNode(n.id); } });
    stage.appendChild(el);
    nodeEl[n.id] = el;
  });

  /* ---------- flows ---------- */
  function anchor(a) {
    var n = N[a.n];
    if (a.s === 'r') return [n.x + n.w, n.y + n.h / 2];
    if (a.s === 'l') return [n.x, n.y + n.h / 2];
    if (a.s === 't') return [a.x != null ? a.x : n.x + n.w / 2, n.y];
    return [a.x != null ? a.x : n.x + n.w / 2, n.y + n.h];
  }
  var partTimer = 0;
  function drawLinks() {
    var out = '';
    FLOWS.forEach(function (f, i) {
      F[f.id] = f;
      var p = anchor(f.a), q = anchor(f.b);
      var dx = q[0] - p[0], dy = q[1] - p[1], len = Math.sqrt(dx * dx + dy * dy), ux = dx / len, uy = dy / len;
      f.p = p; f.q = q; f.len = len; f.dur = Math.max(1.6, len / 60);
      var path = 'M' + p[0] + ',' + p[1] + ' L' + q[0] + ',' + q[1];
      var ah = 'M' + q[0] + ',' + q[1] + ' L' + (q[0] - ux * 9 - uy * 4.5) + ',' + (q[1] - uy * 9 + ux * 4.5) + ' L' + (q[0] - ux * 9 + uy * 4.5) + ',' + (q[1] - uy * 9 - ux * 4.5) + 'Z';
      var horiz = Math.abs(dy) < 1;
      var mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
      f.tag = horiz ? [mx - 13, my - 28] : [mx + 8, my - 8];
      var parts = '';
      if (!f.pend) {
        [0, 1].forEach(function (n) {
          var id = f.id + 'p' + n;
          parts += '<path class="pt" opacity="0" d="M0,-3.5 3.5,0 0,3.5 -3.5,0Z">' +
            '<animateMotion id="' + id + '" dur="' + f.dur.toFixed(2) + 's" begin="indefinite" repeatCount="indefinite" rotate="0" path="' + path + '"/>' +
            '<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.85;1" dur="' + f.dur.toFixed(2) + 's" begin="' + id + '.begin" repeatCount="indefinite"/></path>';
        });
      }
      f.fd = 2 + i * 0.07;
      out += '<g data-f="' + f.id + '"' + (f.pend ? ' class="pend"' : '') + ' style="--fd:' + f.fd.toFixed(2) + 's">' +
        '<path class="fl' + (f.pend ? ' pd' : '') + '" pathLength="1" d="' + path + '"/><path class="ah" d="' + ah + '"/>' +
        '<path class="hit" d="' + path + '"/>' + parts + '</g>';
      var t = document.createElement('button');
      t.type = 'button'; t.className = 'ftag' + (f.pend ? ' pend' : ''); t.textContent = f.id;
      t.setAttribute('aria-label', f.id + ' ' + f.name);
      t.style.left = f.tag[0] + 'px'; t.style.top = f.tag[1] + 'px'; t.style.setProperty('--fd', f.fd.toFixed(2) + 's');
      t.addEventListener('click', function (e) { e.stopPropagation(); pickFlow(f.id); });
      stage.appendChild(t); tagEl[f.id] = t;
    });
    svg.innerHTML = out;
  }
  svg.addEventListener('click', function (e) {
    var g = e.target.closest ? e.target.closest('g[data-f]') : null;
    if (g) { e.stopPropagation(); pickFlow(g.getAttribute('data-f')); }
  });
  function startParticles(delayMs) {
    clearTimeout(partTimer);
    if (reduce) return;
    partTimer = setTimeout(function () {
      FLOWS.forEach(function (f) {
        if (f.pend) return;
        [0, 1].forEach(function (n) {
          var a = document.getElementById(f.id + 'p' + n);
          if (a && a.beginElementAt) { try { a.endElement(); } catch (e) {} a.beginElementAt(n * f.dur / 2); }
        });
      });
    }, delayMs);
  }

  function inOf(id) { return FLOWS.filter(function (f) { return f.b.n === id; }); }
  function outOf(id) { return FLOWS.filter(function (f) { return f.a.n === id; }); }
  function li(f) { return '<li><b>' + f.id + '</b> ' + esc(f.name) + '</li>'; }

  /* ---------- inspector ---------- */
  var PLAY = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 1 9 5 2 9Z" fill="var(--mag)"/></svg>';
  var KIND = { ext: 'External entity', proc: 'Process', store: 'Data store' };
  function overview() {
    insp.classList.remove('tour');
    insp.innerHTML = '<p class="k">Alexandria coast · 2018–2026</p><h1>Shoreline<br>Analytics</h1><p class="s">Data flow diagram</p>' +
      '<hr><button class="btn big" type="button" id="playtour">' + PLAY + 'Play tour</button>' +
      '<p class="k" style="margin:14px 0 0">Or select a box or a flow tag</p>';
    document.getElementById('playtour').addEventListener('click', function (e) { e.stopPropagation(); tourStart(); });
  }
  function nodeBody(n) {
    var ins = inOf(n.id), outs = outOf(n.id);
    return '<p class="cap">' + esc(n.what) + '</p>' +
      (ins.length ? '<h3>Receives</h3><ul>' + ins.map(li).join('') + '</ul>' : '') +
      (outs.length ? '<h3>Sends</h3><ul>' + outs.map(li).join('') + '</ul>' : '');
  }
  function nodeView(n) {
    insp.classList.remove('tour');
    insp.innerHTML = '<button class="back" type="button" id="back">← Overview</button>' +
      '<p class="k">' + KIND[n.kind] + (n.owner ? ' · ' + esc(n.owner) : '') + (n.state === 'pend' ? ' · not finished' : '') + '</p>' +
      '<h2>' + (n.num && n.kind === 'proc' ? n.num + ' ' : '') + esc(n.title) + '</h2>' + nodeBody(n);
    document.getElementById('back').addEventListener('click', function (e) { e.stopPropagation(); clear(); });
  }
  function flowView(f) {
    insp.classList.remove('tour');
    insp.innerHTML = '<button class="back" type="button" id="back">← Overview</button>' +
      '<p class="k">Data flow · ' + (f.pend ? 'not finished' : 'in place') + '</p><h2>' + f.id + ' · ' + esc(f.name) + '</h2>' +
      '<div class="arrow"><span>' + esc(N[f.a.n].title) + '</span>→<span>' + esc(N[f.b.n].title) + '</span></div>' +
      '<p class="cap">' + esc(f.what) + '</p>';
    document.getElementById('back').addEventListener('click', function (e) { e.stopPropagation(); clear(); });
  }
  function tourView() {
    var n = N[TOUR[tour.i]];
    insp.classList.add('tour');
    insp.innerHTML = '<p class="k">Tour · ' + (tour.i + 1) + ' / ' + TOUR.length + '</p>' +
      '<h2>' + n.num + ' ' + esc(n.title) + '</h2><p class="k" style="margin-top:-2px">' + esc(n.owner) + (n.state === 'pend' ? ' · not finished' : '') + '</p>' + nodeBody(n) +
      '<div class="tc"><button class="btn" type="button" id="tprev">Prev</button>' +
      '<button class="btn" type="button" id="ttog">' + (tour.playing ? 'Pause' : 'Play') + '</button>' +
      '<button class="btn" type="button" id="tnext">Next</button>' +
      '<button class="btn exit" type="button" id="texit">Exit</button></div>' +
      '<div class="prog' + (tour.playing ? '' : ' paused') + '" id="prog"><i style="--dur:' + (tour.remain / 1000) + 's"></i></div>';
    function on(id, fn) { document.getElementById(id).addEventListener('click', function (e) { e.stopPropagation(); fn(); }); }
    on('tprev', function () { tourGo(tour.i - 1); });
    on('tnext', function () { tourGo(tour.i + 1); });
    on('ttog', tourToggle);
    on('texit', clear);
  }

  /* ---------- tour ---------- */
  function tourStart() { tour.active = true; tour.playing = true; tourGo(0); }
  function tourGo(i) {
    clearTimeout(tour.timer);
    if (i < 0) i = 0;
    if (i >= TOUR.length) { clear(); return; }
    tour.i = i; tour.remain = STEP_MS; tour.t0 = Date.now();
    state.sel = TOUR[i]; state.flow = null;
    paint();
    if (tour.playing) tour.timer = setTimeout(function () { tourGo(tour.i + 1); }, tour.remain);
  }
  function tourToggle() {
    var b = document.getElementById('ttog'), p = document.getElementById('prog');
    if (tour.playing) {
      tour.playing = false; clearTimeout(tour.timer);
      tour.remain = Math.max(300, tour.remain - (Date.now() - tour.t0));
      if (p) p.classList.add('paused'); if (b) b.textContent = 'Play';
    } else {
      tour.playing = true; tour.t0 = Date.now();
      tour.timer = setTimeout(function () { tourGo(tour.i + 1); }, tour.remain);
      if (p) p.classList.remove('paused'); if (b) b.textContent = 'Pause';
    }
  }
  function tourStop() { tour.active = false; tour.playing = false; clearTimeout(tour.timer); }

  /* ---------- selection ---------- */
  function pickNode(id) { tourStop(); if (state.sel === id && !state.flow) { clear(); return; } state.sel = id; state.flow = null; paint(); }
  function pickFlow(id) { tourStop(); if (state.flow === id) { clear(); return; } state.sel = null; state.flow = id; paint(); }
  function clear() { tourStop(); state.sel = null; state.flow = null; paint(); }

  function paint() {
    var rel = {}, onF = {};
    Object.keys(nodeEl).forEach(function (k) { nodeEl[k].classList.remove('sel', 'rel'); });
    Object.keys(tagEl).forEach(function (k) { tagEl[k].classList.remove('on'); });
    svg.querySelectorAll('g').forEach(function (g) { g.classList.remove('on'); });
    var focus = !!(state.sel || state.flow);
    stage.classList.toggle('focus', focus);
    if (!focus) { overview(); return; }
    if (state.sel) {
      nodeEl[state.sel].classList.add('sel');
      inOf(state.sel).concat(outOf(state.sel)).forEach(function (f) { onF[f.id] = 1; rel[f.a.n] = 1; rel[f.b.n] = 1; });
    } else {
      var f = F[state.flow]; onF[f.id] = 1; rel[f.a.n] = 1; rel[f.b.n] = 1;
    }
    Object.keys(rel).forEach(function (k) { if (k !== state.sel) nodeEl[k].classList.add('rel'); });
    Object.keys(onF).forEach(function (k) {
      tagEl[k].classList.add('on');
      var g = svg.querySelector('g[data-f="' + k + '"]'); if (g) g.classList.add('on');
    });
    if (tour.active) { tourView(); return; }
    if (state.sel) nodeView(N[state.sel]); else flowView(F[state.flow]);
  }

  insp.addEventListener('click', function (e) { e.stopPropagation(); });
  document.getElementById('scroller').addEventListener('click', clear);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') clear();
    else if (tour.active && e.key === 'ArrowRight') tourGo(tour.i + 1);
    else if (tour.active && e.key === 'ArrowLeft') tourGo(tour.i - 1);
  });

  /* ---------- intro ---------- */
  var ro = document.getElementById('ro'), introEnd = 0, raf = 0;
  function readout(t0) {
    cancelAnimationFrame(raf);
    (function step(now) {
      var p = Math.min(Math.max((now - t0 - 50) / 1900, 0), 1);
      ro.textContent = (29.885 + p * (30.016 - 29.885)).toFixed(3) + '°E';
      if (p < 1) raf = requestAnimationFrame(step);
    })(performance.now());
  }
  function play() {
    clearTimeout(introEnd);
    if (reduce) { startParticles(0); return; }
    stage.classList.remove('intro'); void stage.offsetWidth; stage.classList.add('intro');
    readout(performance.now());
    startParticles(3200);
    introEnd = setTimeout(function () { stage.classList.remove('intro'); }, 4300);
  }
  document.getElementById('replay').addEventListener('click', function () { clear(); play(); });

  var scroller = document.getElementById('scroller'), fit = document.getElementById('fit');
  function resize() {
    var avail = scroller.clientWidth, k = avail >= 1120 ? 1 : Math.max(avail / 1120, 0.57);
    stage.style.transform = k < 1 ? 'scale(' + k + ')' : 'none';
    fit.style.width = (1120 * k) + 'px'; fit.style.height = (780 * k) + 'px';
  }
  drawLinks(); overview(); resize(); play();
  window.addEventListener('resize', resize);
})();
</script>
</body></html>
