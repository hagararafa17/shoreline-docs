<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style></head><body><title>Shoreline Analytics ERD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout concept: a hydrographic survey sheet that is being surveyed as you watch.
     A single sounding line sweeps west to east reading out longitude; tables appear where it
     passes, relations are inked in after it, and key diamonds travel along them.
     Double neatline, one ink on cool paper, chart-magenta only for keys, the sweep and the selection. */
  :root {
    --paper: #F0F4F3;
    --surface: #FAFCFB;
    --sea: #D8E7EA;
    --ink: #0E2A33;
    --ink2: #4A6670;
    --line: #8AA3AA;
    --mag: #B01E63;
    --f-head: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #091317; --surface: #0E1D23; --sea: #15333D; --ink: #D5E7EB; --ink2: #8DA6AE; --line: #3C5A64; --mag: #FF6FA8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #091317; --surface: #0E1D23; --sea: #15333D; --ink: #D5E7EB; --ink2: #8DA6AE; --line: #3C5A64; --mag: #FF6FA8;
    color-scheme: dark;
  }

  body { background: var(--paper); color: var(--ink); font-family: var(--f-mono); font-size: 12px; line-height: 1.5;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         padding-block: 26px 30px; }
  .wrap { max-width: 1190px; margin: 0 auto; }

  .sheet { position: relative; border: 1px solid var(--ink); padding: 26px 26px 22px; }
  .sheet::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--ink); pointer-events: none; }
  .tk { position: absolute; pointer-events: none; }
  .tk.t, .tk.b { left: 0; right: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 40px); }
  .tk.l, .tk.r { top: 0; bottom: 0; width: 6px; background: repeating-linear-gradient(0deg, var(--ink) 0 1px, transparent 1px 40px); }
  .tk.t { top: 0; } .tk.b { bottom: 0; } .tk.l { left: 0; } .tk.r { right: 0; }

  .scroller { overflow-x: auto; overflow-y: hidden; }
  .fit { position: relative; }
  .stage { position: relative; width: 1120px; height: 1140px; transform-origin: 0 0; }

  /* depth contours drifting under everything */
  svg.bathy { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
  .bathy g { animation: drift var(--s, 50s) linear infinite; }
  .bathy path { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 1 5; stroke-linecap: round; opacity: .75; }
  .bathy path.ix { stroke-dasharray: none; stroke-width: .8; opacity: .3; }
  @keyframes drift { to { transform: translateX(-360px); } }

  svg.links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .links path.rel { fill: none; stroke: var(--ink2); stroke-width: 1.25; }
  .links .glyph { fill: none; stroke: var(--ink2); stroke-width: 1.25; }
  .links .dot { fill: var(--paper); }
  .links g { transition: opacity .15s; }
  .links g.on path.rel, .links g.on .glyph, .links g.hov path.rel, .links g.hov .glyph { stroke: var(--mag); stroke-width: 1.75; }
  .links .pt { fill: var(--mag); }
  .stage.focus .links g:not(.on) { opacity: .25; }

  .tbl { position: absolute; box-sizing: border-box; background: var(--surface); border: 1.25px solid var(--ink);
         transition: opacity .15s, transform .18s, box-shadow .18s; }
  .tbl.planned { border-style: dashed; border-color: var(--ink2); }
  .tbl.sel { border-color: var(--mag); box-shadow: 5px 5px 0 var(--sea); }
  .stage.focus .tbl:not(.sel):not(.rel) { opacity: .4; }
  .th { all: unset; box-sizing: border-box; display: flex; width: 100%; height: 40px; align-items: center; justify-content: space-between;
        padding: 0 12px; cursor: pointer; background: var(--sea); border-bottom: 1.25px solid var(--ink); }
  .planned .th { background: transparent; border-bottom: 1.25px dashed var(--ink2); }
  .tn { font-weight: 500; font-size: 13px; letter-spacing: .01em; }
  .meta { font-family: var(--f-head); font-weight: 500; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .planned .meta::before { content: ""; display: inline-block; width: 5px; height: 5px; border: 1px solid currentColor; border-radius: 50%; margin-right: 7px; vertical-align: 1px; animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { background: currentColor; } }
  .row { display: flex; align-items: center; height: 28px; padding: 0 12px 0 10px; gap: 8px; cursor: pointer; transition: background .12s, padding-left .12s; }
  .row + .row { border-top: 1px solid color-mix(in srgb, var(--line) 35%, transparent); }
  .row:hover { padding-left: 15px; }
  .row:hover, .row.sel, .row.ref, .row.hl { background: var(--sea); }
  .th:focus-visible, .row:focus-visible, .btn:focus-visible, .replay:focus-visible { outline: 2px solid var(--mag); outline-offset: -2px; }
  .kg { flex: 0 0 12px; height: 12px; }
  .kg svg { display: block; }
  .cn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.pkrow .cn { font-weight: 500; }
  .ct { flex: 0 0 auto; font-size: 10.5px; color: var(--ink2); }

  .id { text-transform: none; letter-spacing: .02em; }
  .insp { position: absolute; left: 800px; top: 0; width: 320px; height: 447px; box-sizing: border-box; background: var(--surface);
          border: 1.25px solid var(--ink); padding: 20px 20px 16px; overflow: auto; }
  .insp.tour { display: flex; flex-direction: column; }
  .insp::after { content: ""; position: absolute; inset: 4px; border: 1px solid var(--line); pointer-events: none; }
  .k { font-family: var(--f-head); font-weight: 500; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); margin: 0 0 8px; }
  .insp h1 { font-family: var(--f-head); font-weight: 600; font-size: 44px; line-height: .95; letter-spacing: .01em; text-transform: uppercase; margin: 0 0 14px; }
  .insp h2 { font-weight: 500; font-size: 15px; margin: 0 0 8px; word-break: break-all; }
  .insp p { margin: 0 0 10px; color: var(--ink2); }
  .insp .s { font-family: var(--f-head); font-weight: 500; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); margin: 0; }
  .insp hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0 14px; }
  .insp h3 { font-family: var(--f-head); font-weight: 500; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); margin: 10px 0 4px; }
  .insp ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
  .insp li { padding-left: 14px; position: relative; font-size: 11.5px; }
  .insp li::before { content: ""; position: absolute; left: 1px; top: .55em; width: 5px; height: 5px; border: 1px solid var(--ink2); transform: rotate(45deg); }
  .insp code { background: var(--sea); padding: 0 3px; }
  .back { all: unset; cursor: pointer; font-size: 11px; color: var(--mag); display: inline-block; margin-bottom: 10px; }
  .back:hover { text-decoration: underline; }

  .btn { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--ink); padding: 4px 10px; font-size: 11px; letter-spacing: .04em; color: var(--ink); background: var(--surface); transition: background .12s, color .12s, border-color .12s; }
  .btn:hover { background: var(--sea); border-color: var(--mag); }
  .btn.big { display: inline-flex; align-items: center; gap: 9px; padding: 8px 14px; font-size: 12px; }
  .btn.big svg { display: block; }
  .tc { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .tc .exit { margin-left: auto; }
  .prog { height: 2px; background: var(--line); margin-top: 12px; position: relative; overflow: hidden; }
  .prog i { position: absolute; inset: 0; background: var(--mag); transform-origin: 0 50%; animation: fill var(--dur, 4.2s) linear both; }
  .prog.paused i { animation-play-state: paused; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .cap { color: var(--ink) !important; font-size: 13px; line-height: 1.45; }
  .stat { font-family: var(--f-head); font-weight: 600; font-size: 56px; line-height: 1; letter-spacing: .01em; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  .statl { font-family: var(--f-head); font-weight: 500; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); margin: 2px 0 10px; }
  .bar { display: flex; gap: 2px; height: 10px; margin: 0 0 6px; }
  .bar i { display: block; background: var(--ink); transform-origin: 0 50%; animation: grow .9s cubic-bezier(.2,.7,.2,1) both; }
  .bar i + i { background: transparent; border: 1px solid var(--ink); box-sizing: border-box; animation-delay: .15s; }
  .barl { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink2); }
  @keyframes grow { from { transform: scaleX(0); } }

  .geo { margin: 10px 2px 0; font-size: 10.5px; color: var(--ink2); letter-spacing: .04em; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .replay { all: unset; cursor: pointer; color: var(--ink2); }
  .replay:hover { color: var(--mag); text-decoration: underline; }

  /* sounding line */
  .sweep { position: absolute; top: -14px; bottom: -14px; left: 0; width: 0; border-left: 1px solid var(--mag); opacity: 0; pointer-events: none; z-index: 6; }
  .sweep .ro { position: absolute; top: 22px; right: 7px; font-size: 10.5px; color: var(--mag); background: var(--paper); padding: 0 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* intro: only active while .intro is on the stage; the resting state has no animation at all */
  .stage.intro .sweep { animation: sweep 1.9s linear .05s both; }
  @keyframes sweep { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 94% { opacity: 1; } 100% { transform: translateX(1120px); opacity: 0; } }
  .stage.intro .tbl, .stage.intro .insp { animation: wipe .85s cubic-bezier(.2,.7,.2,1) var(--d, 0s) backwards; }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); opacity: 0; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
  .stage.intro .row { animation: rowin .45s ease-out calc(var(--d, 0s) + .4s + var(--i, 0) * .03s) backwards; }
  @keyframes rowin { from { opacity: 0; transform: translateX(-8px); } }
  .stage.intro .links path.rel { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.1s cubic-bezier(.5, 0, .2, 1) 2s backwards; }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  .stage.intro .links .glyph { animation: fadein .5s ease-out 2.9s backwards; }
  @keyframes fadein { from { opacity: 0; } }
  .stage.intro .bathy { animation: fadein 1.6s ease-out backwards; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .links .pt, .sweep { display: none; }
  }
</style>

<div class="wrap">
  <figure style="margin:0">
    <div class="sheet">
      <i class="tk t"></i><i class="tk b"></i><i class="tk l"></i><i class="tk r"></i>
      <div class="scroller" id="scroller">
        <div class="fit" id="fit">
          <div class="stage" id="stage">
            <svg class="bathy" id="bathy" aria-hidden="true"></svg>
            <svg class="links" id="links" role="img" aria-label="One sector has many shoreline segments, many transects and validation rows. One transect has one risk assessment. One risk class is used by many assessments."></svg>
            <aside class="insp" id="insp" aria-live="polite"></aside>
            <div class="sweep" id="sweep" aria-hidden="true"><span class="ro" id="ro">29.885°E</span></div>
          </div>
        </div>
      </div>
    </div>
    <figcaption class="geo"><span>29.885°E – 30.016°E · 31.1°N – 31.3°N · EPSG:32636</span><button class="replay" id="replay" type="button">↻ Replay survey</button></figcaption>
  </figure>
</div>

<script>
(function () {
  var TABLES = [
    { id: 'cross_sensor_validation', planned: false, x: 0, y: 0, w: 290, meta: 'rows', count: 3, d: 0.2,
      purpose: 'How far the Sentinel-2 shoreline of 2026 lies from a Landsat 9 shoreline of the same year, for each sector. It checks 2026 only.',
      cols: [
        { n: 'sector_id', t: 'integer', k: 'fk', ref: ['sectors', 'sector_id'], note: 'The sector checked. Part of the key.' },
        { n: 'validation_year', t: 'smallint', note: 'The year compared: 2026. Part of the key.' },
        { n: 'reference_sensor', t: 'varchar(30)', note: 'The other satellite: Landsat 9. Part of the key.' },
        { n: 'median_distance_m', t: 'numeric(7,2)', note: 'Typical gap between the two shorelines, in metres.' },
        { n: 'mean_distance_m', t: 'numeric(7,2)', note: 'Average gap in metres.' },
        { n: 'p95_distance_m', t: 'numeric(7,2)', note: 'Gap that 95% of the line stays under.' },
        { n: 'within_30m_pct', t: 'numeric(5,2)', note: 'Share of the line within 30 m of the other shoreline. Feeds the Confidence Score.' },
        { n: 'within_60m_pct', t: 'numeric(5,2)', note: 'Share within 60 m.' },
        { n: 'within_90m_pct', t: 'numeric(5,2)', note: 'Share within 90 m.' },
        { n: 'length_difference_pct', t: 'numeric(6,2)', note: 'Difference in total shoreline length between the two satellites.' },
        { n: 'assessment', t: 'varchar(40)', note: 'The team label: Strong agreement, Moderate agreement or Localized discrepancies.' }
      ],
      rules: ['Key: <code>(sector_id, validation_year, reference_sensor)</code>', 'The three <code>within_</code> shares are between 0 and 100', 'Not ground truth, and 2026 only'] },

    { id: 'sectors', planned: false, x: 0, y: 440, w: 290, meta: 'rows', count: 3, d: 0.1,
      purpose: 'The three study areas. Shoreline segments, transects and validation belong to a sector.',
      cols: [
        { n: 'sector_id', t: 'serial', k: 'pk', note: 'Key generated by the database.' },
        { n: 'sector_name', t: 'varchar(50)', note: 'Corniche Infill, Eastern Harbour or Montaza Bay. Unique.' },
        { n: 'geom', t: 'geometry', note: 'Polygon, SRID 32636. A provisional working zone, not an official boundary.' }
      ],
      rules: ['<code>sector_name</code> is unique', '<code>geom</code> is a Polygon in SRID 32636'] },

    { id: 'confidence_parameters', planned: false, x: 0, y: 650, w: 290, meta: 'rows', count: 14, d: 0.3,
      purpose: 'The weights and settings of the Confidence Score. Change a value and run assess_risk() again.',
      cols: [
        { n: 'param_name', t: 'varchar(40)', k: 'pk', note: 'Name of the setting, for example w_statistical.' },
        { n: 'param_value', t: 'numeric(8,3)', note: 'Its value.' },
        { n: 'description', t: 'text', note: 'What the setting does.' }
      ],
      rules: ['Six weights, the p-value limits, the band limits and a few defaults'] },

    { id: 'shoreline_segments', planned: false, x: 360, y: 0, w: 370, meta: 'rows', count: 205, d: 0.6,
      purpose: 'One row per shoreline segment (LineString) per sector and year. Precision is about 10 m, the pixel size.',
      cols: [
        { n: 'segment_pk', t: 'serial', k: 'pk', note: 'Key generated by the database.' },
        { n: 'sector_id', t: 'integer', k: 'fk', ref: ['sectors', 'sector_id'], note: 'The sector this segment lies in.' },
        { n: 'obs_year', t: 'smallint', note: 'Observation year, 2018 to 2026.' },
        { n: 'segment_id', t: 'integer', note: 'Segment number within its year, from the source file.' },
        { n: 'revised_segment_id', t: 'varchar(20)', note: 'Id used in the team ANALYSIS files. Unique; empty for the 2024 scene.' },
        { n: 'dataset_source', t: 'varchar(40)', note: 'Original scenes (2018 to 2023), one alternative scene (2024), or alternative scenes (2025 and 2026).' },
        { n: 'imagery', t: 'varchar(80)', note: 'Scene id when the team recorded one. Used for 2024.' },
        { n: 'length_m', t: 'numeric(10,2)', note: 'Segment length in metres. Length is not an erosion rate.' },
        { n: 'method', t: 'varchar(60)', note: 'Extraction method: southernmost sea pixel.' },
        { n: 'status', t: 'varchar(30)', note: 'PROVISIONAL_UNVALIDATED, or PROVISIONAL_ACCEPT for the 2024 scene.' },
        { n: 'mean_boundary_distance_m', t: 'numeric(6,2)', note: 'Mean distance to the reference water boundary. Only 2018 to 2023.' },
        { n: 'within_20m_pct', t: 'numeric(5,2)', note: 'Share of the line within 20 m of that boundary. Only 2018 to 2023. Feeds the Confidence Score.' },
        { n: 'proximity_status', t: 'varchar(40)', note: 'HIGH, MODERATE or LOW mask agreement; SPATIAL_CONSISTENCY_SCREENED for 2024.' },
        { n: 'validation_note', t: 'text', note: 'Caveat from the processing team: not independently verified.' },
        { n: 'geom', t: 'geometry', note: 'LineString, SRID 32636, with a GiST spatial index.' }
      ],
      rules: ['Unique: <code>revised_segment_id</code>, and <code>(obs_year, sector_id, segment_id)</code>',
              '<code>dataset_source</code> follows the year: original to 2023, alternative scene in 2024, alternative scenes from 2025',
              '<code>status</code> is one of two provisional values',
              'Indexes: GiST on <code>geom</code>; B-tree on <code>(sector_id, obs_year)</code>'] },

    { id: 'transect_rates', planned: false, x: 360, y: 490, w: 370, meta: 'rows', count: 145, d: 0.75,
      purpose: 'One row per transect: a line across the shoreline every 100 m, with a straight-line fit of its position against the year. Only transects with five or more observed years.',
      cols: [
        { n: 'transect_id', t: 'integer', k: 'pk', note: 'The transect number from the remote-sensing team.' },
        { n: 'sector_id', t: 'integer', k: 'fk', ref: ['sectors', 'sector_id'], note: 'The sector the transect lies in.' },
        { n: 'observed_years', t: 'smallint', note: 'Years with a shoreline position, 5 to 9.' },
        { n: 'first_year', t: 'smallint', note: 'First observed year.' },
        { n: 'last_year', t: 'smallint', note: 'Last observed year. Must be after the first.' },
        { n: 'rate_m_per_year', t: 'numeric(10,6)', note: 'Slope of the fit. Positive is seaward (accretion), negative is landward (erosion).' },
        { n: 'rate_excl_2024', t: 'numeric(10,6)', note: 'The same rate with the 2024 scene left out (sensitivity test).' },
        { n: 'r_squared', t: 'double', note: 'How well a straight line fits, 0 to 1.' },
        { n: 'p_value', t: 'double', note: 'Chance of this slope if there were no trend.' },
        { n: 'adjusted_p_value', t: 'double', note: 'The p-value corrected for many transects (Benjamini-Hochberg).' },
        { n: 'trend', t: 'varchar(20)', note: 'Accretion, Erosion or No linear change.' },
        { n: 'significant', t: 'boolean', note: 'Adjusted p-value below 0.05.' },
        { n: 'strong_fit', t: 'boolean', note: 'R squared of at least 0.30.' },
        { n: 'reliability_class', t: 'varchar(60)', note: 'The team label, for example Significant trend + stronger fit.' },
        { n: 'endpoint_displacement_m', t: 'numeric(8,2)', note: '2018 to 2026 shift, only for the four transects that were checked.' },
        { n: 'spatially_verified', t: 'boolean', note: 'True when the shoreline crossings were rechecked against the final shoreline file.' }
      ],
      rules: ['<code>observed_years</code> between 5 and 9', '<code>last_year</code> is after <code>first_year</code>, both within 2018 to 2026', 'The three probabilities are between 0 and 1'] },

    { id: 'risk_assessments', planned: false, x: 800, y: 490, w: 320, meta: 'rows', count: 145, d: 1.4,
      purpose: 'One Risk Class and one Confidence Score for each transect. Filled by shoreline.assess_risk(). The six parts are kept to show why.',
      cols: [
        { n: 'risk_id', t: 'serial', k: 'pk', note: 'Key generated by the database.' },
        { n: 'transect_id', t: 'integer', k: 'fk', ref: ['transect_rates', 'transect_id'], note: 'The transect being classified. Unique: one assessment per transect. The sector is reached through it.' },
        { n: 'risk_class', t: 'varchar(10)', k: 'fk', ref: ['risk_thresholds', 'risk_class'], note: 'VERY_LOW, LOW, MODERATE, HIGH or VERY_HIGH, from the rate.' },
        { n: 'confidence_score', t: 'numeric(4,3)', note: 'From 0 to 1. Weighted from the six parts below.' },
        { n: 'confidence_band', t: 'varchar(6)', note: 'HIGH, MEDIUM or LOW. HIGH needs a significant trend.' },
        { n: 'part_statistical', t: 'numeric(4,3)', note: 'Evidence from the adjusted p-value.' },
        { n: 'part_fit', t: 'numeric(4,3)', note: 'R squared.' },
        { n: 'part_years', t: 'numeric(4,3)', note: 'Observed years out of nine.' },
        { n: 'part_stability', t: 'numeric(4,3)', note: 'How little the rate moves without the 2024 scene.' },
        { n: 'part_geometry', t: 'numeric(4,3)', note: 'Line quality of the sector.' },
        { n: 'part_validation', t: 'numeric(4,3)', note: 'Landsat 9 agreement of the sector.' },
        { n: 'assessed_at', t: 'timestamp', note: 'When the assessment was made. Defaults to now().' }
      ],
      rules: ['<code>transect_id</code> is unique and deleting a transect deletes its assessment', 'The score and every part are between 0 and 1', '<code>confidence_band</code> is HIGH, MEDIUM or LOW'] },

    { id: 'risk_thresholds', planned: false, x: 800, y: 935, w: 320, meta: 'rows', count: 5, d: 1.5,
      purpose: 'The five risk classes and their limits, in metres per year (USGS ranking). Change a limit and the classes follow.',
      cols: [
        { n: 'risk_class', t: 'varchar(10)', k: 'pk', note: 'VERY_LOW, LOW, MODERATE, HIGH or VERY_HIGH.' },
        { n: 'risk_rank', t: 'smallint', note: '1 (lowest risk) to 5 (highest). Unique.' },
        { n: 'rate_min', t: 'numeric(6,3)', note: 'Lowest rate in the class. Empty means no lower limit.' },
        { n: 'rate_max', t: 'numeric(6,3)', note: 'Rates below this belong to the class. Empty means no upper limit.' },
        { n: 'description', t: 'text', note: 'The class in plain words.' }
      ],
      rules: ['A rate is in a class when <code>rate_min</code> ≤ rate &lt; <code>rate_max</code>', '<code>rate_min</code> is below <code>rate_max</code>'] }
  ];

  var RELS = [
    { id: 'r1', from: ['sectors', 'sector_id'], to: ['shoreline_segments', 'sector_id'], trunk: 325, dur: 3.4, text: 'One sector has many shoreline segments.' },
    { id: 'r2', from: ['sectors', 'sector_id'], to: ['transect_rates', 'sector_id'], trunk: 325, dur: 3.4, text: 'One sector has many transects.' },
    { id: 'r3', from: ['sectors', 'sector_id'], to: ['cross_sensor_validation', 'sector_id'], vert: 145, dur: 1.6, text: 'One sector has one validation row for each year and satellite.' },
    { id: 'r4', from: ['transect_rates', 'transect_id'], to: ['risk_assessments', 'transect_id'], trunk: null, dur: 2.4, text: 'One transect has one risk assessment.' },
    { id: 'r5', from: ['risk_thresholds', 'risk_class'], to: ['risk_assessments', 'risk_class'], vert: 960, dur: 1.6, text: 'One risk class is used by many assessments.' }
  ];

  var TOUR = [
    { t: 'sectors', cap: 'Three study areas along the Alexandria coast.', stat: { n: 3, l: 'sectors' } },
    { t: 'shoreline_segments', cap: 'One satellite shoreline for each sector and year, 2018 to 2026.', stat: { n: 205, l: 'segments', bar: [157, 48] } },
    { t: 'shoreline_segments', c: 'sector_id', cap: 'Every segment points to the sector it lies in.' },
    { t: 'transect_rates', cap: 'A line across the shoreline every 100 m. Its position over the years gives a rate in metres per year.', stat: { n: 145, l: 'transects' } },
    { t: 'cross_sensor_validation', cap: 'A second satellite, Landsat 9, checks the 2026 shoreline of each sector.' },
    { t: 'risk_assessments', cap: 'A Risk Class from the rate, and a Confidence Score from the strength of the evidence.' },
    { t: 'risk_thresholds', cap: 'Five risk classes with their limits. Change a limit and the classes follow.' }
  ];
  var STEP_MS = 4200;

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage'), svg = document.getElementById('links'), insp = document.getElementById('insp');
  var byId = {}, rowEl = {}, tblEl = {}, state = { table: null, col: null };
  var tour = { active: false, i: 0, playing: false, t0: 0, remain: STEP_MS, timer: 0 };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  var GLYPH = {
    pk: '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1 11 6 6 11 1 6Z" fill="var(--mag)"/></svg>',
    fk: '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1.5 10.5 6 6 10.5 1.5 6Z" fill="none" stroke="var(--mag)" stroke-width="1.3"/></svg>'
  };

  /* ---------- depth contours: seamless because every wavelength divides 360 ---------- */
  (function bathy() {
    var el = document.getElementById('bathy'), out = '';
    for (var k = 0; k < 10; k++) {
      var y0 = 50 + k * 112, a1 = 7 + (k % 3) * 3, a2 = 3 + (k % 2) * 2, ph = k * 0.9, d = '';
      for (var x = -360; x <= 1480; x += 10) {
        var y = y0 + a1 * Math.sin(2 * Math.PI * x / 360 + ph) + a2 * Math.sin(2 * Math.PI * x / 180 + ph * 2);
        d += (x === -360 ? 'M' : 'L') + x + ',' + y.toFixed(1);
      }
      out += '<g style="--s:' + (46 + k * 7) + 's"><path' + (k % 3 === 0 ? ' class="ix"' : '') + ' d="' + d + '"/></g>';
    }
    el.setAttribute('viewBox', '0 0 1120 1140');
    el.innerHTML = out;
  })();

  /* ---------- tables ---------- */
  TABLES.forEach(function (t) {
    byId[t.id] = t;
    var el = document.createElement('div');
    el.className = 'tbl' + (t.planned ? ' planned' : '');
    el.style.left = t.x + 'px'; el.style.top = t.y + 'px'; el.style.width = t.w + 'px';
    el.style.setProperty('--d', t.d + 's');
    var h = document.createElement('button');
    h.className = 'th'; h.type = 'button';
    var meta = t.count ? '<span data-n="' + t.count + '">' + t.count + '</span> ' + t.meta : t.meta;
    h.innerHTML = '<span class="tn">' + t.id + '</span><span class="meta">' + meta + '</span>';
    h.addEventListener('click', function (e) { e.stopPropagation(); pick(t.id, null); });
    el.appendChild(h);
    t.cols.forEach(function (c, i) {
      var r = document.createElement('div');
      r.className = 'row' + (c.k === 'pk' ? ' pkrow' : '');
      r.style.setProperty('--i', i);
      r.tabIndex = 0; r.setAttribute('role', 'button');
      r.innerHTML = '<span class="kg">' + (c.k ? GLYPH[c.k] : '') + '</span><span class="cn">' + c.n + '</span><span class="ct">' + esc(c.t) + '</span>';
      r.addEventListener('click', function (e) { e.stopPropagation(); pick(t.id, c.n); });
      r.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(t.id, c.n); } });
      r.addEventListener('mouseenter', function () { hover(t.id, c.n, true); });
      r.addEventListener('mouseleave', function () { hover(t.id, c.n, false); });
      el.appendChild(r);
      rowEl[t.id + '.' + c.n] = r;
    });
    stage.appendChild(el);
    tblEl[t.id] = el;
  });

  function anchorY(key) { var r = rowEl[key]; return r.parentNode.offsetTop + r.offsetTop + r.offsetHeight / 2; }

  var NS = 'http://www.w3.org/2000/svg';
  function drawLinks() {
    var out = '', defs = '';
    RELS.forEach(function (rel) {
      var pt = tblEl[rel.from[0]], ct = tblEl[rel.to[0]];
      if (rel.vert) {
        var vx = rel.vert, pTop = pt.offsetTop, cBot = ct.offsetTop + ct.offsetHeight;
        rel.path = 'M' + vx + ',' + pTop + ' V' + cBot;
        var vg = '<path class="glyph" d="M' + (vx - 6) + ',' + (pTop - 9) + ' H' + (vx + 6) + ' M' + (vx - 6) + ',' + (pTop - 14) + ' H' + (vx + 6) + '"/>' +
                 '<path class="glyph" d="M' + vx + ',' + (cBot + 13) + ' L' + (vx - 6) + ',' + cBot + ' M' + vx + ',' + (cBot + 13) + ' L' + (vx + 6) + ',' + cBot + '"/>' +
                 '<circle class="glyph dot" cx="' + vx + '" cy="' + (cBot + 19) + '" r="3.6"/>';
        var vp = '';
        [0, 1].forEach(function (n) {
          var id = rel.id + 'p' + n;
          vp += '<path class="pt" opacity="0" d="M0,-3.5 3.5,0 0,3.5 -3.5,0Z">' +
            '<animateMotion id="' + id + '" dur="1.6s" begin="indefinite" repeatCount="indefinite" rotate="0" path="' + rel.path + '"/>' +
            '<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="1.6s" begin="' + id + '.begin" repeatCount="indefinite"/></path>';
        });
        out += '<g data-rel="' + rel.id + '"><path class="rel" pathLength="1" d="' + rel.path + '"/>' + vg + vp + '</g>';
        return;
      }
      var px = pt.offsetLeft + pt.offsetWidth, py = anchorY(rel.from.join('.'));
      var cx = ct.offsetLeft, cy = anchorY(rel.to.join('.'));
      var tx = rel.trunk || (px + cx) / 2;
      var s = cy > py ? 1 : -1, d = Math.abs(cy - py), r = Math.min(10, d / 2);
      var path = d < 1 ? 'M' + px + ',' + py + ' H' + cx
        : 'M' + px + ',' + py + ' H' + (tx - r) + ' Q' + tx + ',' + py + ' ' + tx + ',' + (py + s * r) +
          ' V' + (cy - s * r) + ' Q' + tx + ',' + cy + ' ' + (tx + r) + ',' + cy + ' H' + cx;
      rel.path = path;
      /* parent end: exactly one (two bars). child end: zero or many (circle and crow's foot). */
      var g = '<path class="glyph" d="M' + (px + 9) + ',' + (py - 6) + ' V' + (py + 6) + ' M' + (px + 14) + ',' + (py - 6) + ' V' + (py + 6) + '"/>' +
              '<path class="glyph" d="M' + (cx - 13) + ',' + cy + ' L' + cx + ',' + (cy - 6) + ' M' + (cx - 13) + ',' + cy + ' L' + cx + ',' + (cy + 6) + ' M' + (cx - 13) + ',' + cy + ' H' + cx + '"/>' +
              '<circle class="glyph dot" cx="' + (cx - 19) + '" cy="' + cy + '" r="3.6"/>';
      /* two key diamonds travel parent to child */
      var parts = '';
      [0, 1].forEach(function (n) {
        var id = rel.id + 'p' + n;
        parts += '<path class="pt" opacity="0" d="M0,-3.5 3.5,0 0,3.5 -3.5,0Z">' +
          '<animateMotion id="' + id + '" dur="' + rel.dur + 's" begin="indefinite" repeatCount="indefinite" rotate="0" path="' + path + '"/>' +
          '<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1" dur="' + rel.dur + 's" begin="' + id + '.begin" repeatCount="indefinite"/></path>';
      });
      out += '<g data-rel="' + rel.id + '"><path class="rel" pathLength="1" d="' + path + '"/>' + g + parts + '</g>';
    });
    svg.innerHTML = out;
  }
  var partTimer = 0;
  function startParticles(delayMs) {
    clearTimeout(partTimer);
    if (reduce) return;
    var ms = delayMs;
    partTimer = setTimeout(function () {
      RELS.forEach(function (rel) {
        [0, 1].forEach(function (n) {
          var a = document.getElementById(rel.id + 'p' + n);
          if (a && a.beginElementAt) { try { a.endElement(); } catch (e) {} a.beginElementAt(n * rel.dur / 2); }
        });
      });
    }, ms);
  }

  function relsOf(id) { return RELS.filter(function (r) { return r.from[0] === id || r.to[0] === id; }); }

  /* hover an FK or a referenced key: its relation lights up */
  function hover(tid, cn, on) {
    RELS.forEach(function (rel) {
      var hit = (rel.from[0] === tid && rel.from[1] === cn) || (rel.to[0] === tid && rel.to[1] === cn);
      if (!hit) return;
      var g = svg.querySelector('g[data-rel="' + rel.id + '"]');
      if (g) g.classList.toggle('hov', on);
      rowEl[rel.from.join('.')].classList.toggle('hl', on);
      rowEl[rel.to.join('.')].classList.toggle('hl', on);
    });
  }

  /* ---------- counting ---------- */
  function countUp(el, n, delay, dur) {
    if (reduce) { el.textContent = n; return; }
    el.textContent = '0';
    var t0 = performance.now() + delay;
    (function step(now) {
      var p = Math.min(Math.max((now - t0) / dur, 0), 1), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(n * e);
      if (p < 1) requestAnimationFrame(step);
    })(performance.now());
  }

  /* ---------- inspector views ---------- */
  var PLAY = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 1 9 5 2 9Z" fill="var(--mag)"/></svg>';
  function overview() {
    insp.classList.remove('tour');
    insp.innerHTML = '<p class="k">Alexandria coast · 2018–2026</p><h1>Shoreline<br>Analytics</h1><p class="s">Entity–relationship diagram</p>' +
      '<hr><button class="btn big" type="button" id="playtour">' + PLAY + 'Play tour</button>' +
      '<p class="k" style="margin:14px 0 0">Or select a table or a column</p>';
    document.getElementById('playtour').addEventListener('click', function (e) { e.stopPropagation(); tourStart(); });
  }
  function tableView(t) {
    insp.classList.remove('tour');
    var stat = t.id === 'shoreline_segments'
      ? '<h3>Source</h3><div class="bar"><i style="width:76.6%"></i><i style="width:23.4%"></i></div><div class="barl"><span>157 · 2018–24</span><span>48 · 2025–26</span></div>' : '';
    insp.innerHTML = '<button class="back" type="button" id="back">← Overview</button>' +
      '<p class="k">' + (t.planned ? 'Planned' : 'Table') + ' · ' + (t.planned ? 'not created yet' : t.count + ' rows') + '</p>' +
      '<h2>' + t.id + '</h2><p>' + esc(t.purpose) + '</p>' + stat +
      '<h3>Links</h3><ul>' + relsOf(t.id).map(function (r) { return '<li>' + r.text + '</li>'; }).join('') + '</ul>' +
      '<h3>Rules</h3><ul>' + t.rules.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
  }
  function colView(t, c) {
    insp.classList.remove('tour');
    var f = [c.k === 'pk' ? 'Primary key' : c.k === 'fk' ? 'Foreign key' : null].filter(Boolean);
    insp.innerHTML = '<button class="back" type="button" id="back">← ' + t.id + '</button>' +
      '<p class="k"><span class="id">' + t.id + '</span></p><h2>' + c.n + '</h2><p><code>' + esc(c.t) + '</code>' + (f.length ? ' · ' + f[0] : '') + '</p><p>' + esc(c.note) + '</p>' +
      (c.ref ? '<h3>Points to</h3><ul><li><code>' + c.ref[0] + '.' + c.ref[1] + '</code></li></ul>' : '');
  }
  function tourView() {
    var s = TOUR[tour.i];
    insp.classList.add('tour');
    var stat = '';
    if (s.stat) {
      stat = '<div class="stat" id="statn">' + s.stat.n + '</div><div class="statl">' + s.stat.l + '</div>' +
        (s.stat.bar ? '<div class="bar"><i style="width:' + (s.stat.bar[0] / s.stat.n * 100).toFixed(1) + '%"></i><i style="width:' + (s.stat.bar[1] / s.stat.n * 100).toFixed(1) + '%"></i></div>' +
          '<div class="barl"><span>' + s.stat.bar[0] + ' · 2018–24</span><span>' + s.stat.bar[1] + ' · 2025–26</span></div>' : '');
    }
    insp.innerHTML = '<p class="k">Tour · ' + (tour.i + 1) + ' / ' + TOUR.length + '</p>' +
      '<h2>' + s.t + (s.c ? '.' + s.c : '') + '</h2><p class="cap">' + esc(s.cap) + '</p>' + stat +
      '<div class="tc"><button class="btn" type="button" id="tprev">Prev</button>' +
      '<button class="btn" type="button" id="ttog">' + (tour.playing ? 'Pause' : 'Play') + '</button>' +
      '<button class="btn" type="button" id="tnext">Next</button>' +
      '<button class="btn exit" type="button" id="texit">Exit</button></div>' +
      '<div class="prog' + (tour.playing ? '' : ' paused') + '" id="prog"><i style="--dur:' + (tour.remain / 1000) + 's"></i></div>';
    function on(id, fn) { document.getElementById(id).addEventListener('click', function (e) { e.stopPropagation(); fn(); }); }
    on('tprev', function () { tourGo(tour.i - 1, true); });
    on('tnext', function () { tourGo(tour.i + 1, true); });
    on('ttog', tourToggle);
    on('texit', function () { clear(); });
    if (s.stat) countUp(document.getElementById('statn'), s.stat.n, 0, 900);
  }

  /* ---------- tour ---------- */
  function tourStart() { tour.active = true; tour.playing = true; tourGo(0, false); }
  function tourGo(i, manual) {
    clearTimeout(tour.timer);
    if (i < 0) i = 0;
    if (i >= TOUR.length) { clear(); return; }
    tour.i = i; tour.remain = STEP_MS; tour.t0 = Date.now();
    var s = TOUR[i];
    state.table = s.t; state.col = s.c || null;
    paint();
    if (tour.playing) tour.timer = setTimeout(function () { tourGo(tour.i + 1, false); }, tour.remain);
  }
  function tourToggle() {
    var b = document.getElementById('ttog'), p = document.getElementById('prog');
    if (tour.playing) {
      tour.playing = false; clearTimeout(tour.timer);
      tour.remain = Math.max(300, tour.remain - (Date.now() - tour.t0));
      if (p) p.classList.add('paused'); if (b) b.textContent = 'Play';
    } else {
      tour.playing = true; tour.t0 = Date.now();
      tour.timer = setTimeout(function () { tourGo(tour.i + 1, false); }, tour.remain);
      if (p) p.classList.remove('paused'); if (b) b.textContent = 'Pause';
    }
  }
  function tourStop() { tour.active = false; tour.playing = false; clearTimeout(tour.timer); }

  /* ---------- selection ---------- */
  function pick(tid, col) {
    tourStop();
    if (state.table === tid && state.col === col && col === null) { tid = null; }
    state.table = tid; state.col = col; paint();
  }
  function clear() { tourStop(); state.table = null; state.col = null; paint(); }

  function paint() {
    var tid = state.table, related = {}, onRel = {};
    Object.keys(rowEl).forEach(function (k) { rowEl[k].classList.remove('sel', 'ref'); });
    Object.keys(tblEl).forEach(function (k) { tblEl[k].classList.remove('sel', 'rel'); });
    svg.querySelectorAll('g').forEach(function (g) { g.classList.remove('on'); });
    stage.classList.toggle('focus', !!tid);
    if (!tid) { overview(); return; }
    var t = byId[tid];
    tblEl[tid].classList.add('sel');
    relsOf(tid).forEach(function (r) { onRel[r.id] = 1; related[r.from[0]] = 1; related[r.to[0]] = 1; });
    Object.keys(related).forEach(function (k) { tblEl[k].classList.add('rel'); });
    svg.querySelectorAll('g').forEach(function (g) { if (onRel[g.getAttribute('data-rel')]) g.classList.add('on'); });
    var c = state.col ? t.cols.filter(function (x) { return x.n === state.col; })[0] : null;
    if (c) {
      rowEl[tid + '.' + c.n].classList.add('sel');
      if (c.ref) { rowEl[c.ref.join('.')].classList.add('ref'); tblEl[c.ref[0]].classList.add('rel'); }
    }
    if (tour.active) { tourView(); return; }
    if (c) {
      colView(t, c);
      document.getElementById('back').addEventListener('click', function (e) { e.stopPropagation(); pick(tid, null); });
    } else {
      tableView(t);
      document.getElementById('back').addEventListener('click', function (e) { e.stopPropagation(); clear(); });
    }
  }

  insp.addEventListener('click', function (e) { e.stopPropagation(); });
  document.getElementById('scroller').addEventListener('click', clear);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') clear();
    else if (tour.active && e.key === 'ArrowRight') tourGo(tour.i + 1, true);
    else if (tour.active && e.key === 'ArrowLeft') tourGo(tour.i - 1, true);
  });

  /* ---------- intro: the sounding line ---------- */
  var ro = document.getElementById('ro'), introEnd = 0, raf = 0;
  function readout(t0) {
    cancelAnimationFrame(raf);
    (function step(now) {
      var p = Math.min(Math.max((now - t0 - 50) / 1900, 0), 1);
      ro.textContent = (29.885 + p * (30.016 - 29.885)).toFixed(3) + '°E';
      if (p < 1) raf = requestAnimationFrame(step);
    })(performance.now());
  }
  function play() {
    clearTimeout(introEnd);
    if (reduce) { startParticles(0); return; }
    stage.classList.remove('intro'); void stage.offsetWidth; stage.classList.add('intro');
    readout(performance.now());
    TABLES.forEach(function (t) {
      var n = tblEl[t.id].querySelector('[data-n]');
      if (n) countUp(n, t.count, t.d * 1000 + 200, 1300);
    });
    startParticles(3200);
    introEnd = setTimeout(function () { stage.classList.remove('intro'); }, 4300);
  }
  document.getElementById('replay').addEventListener('click', function () { clear(); play(); });

  var scroller = document.getElementById('scroller'), fit = document.getElementById('fit');
  function resize() {
    var avail = scroller.clientWidth, k = avail >= 1120 ? 1 : Math.max(avail / 1120, 0.57);
    stage.style.transform = k < 1 ? 'scale(' + k + ')' : 'none';
    fit.style.width = (1120 * k) + 'px'; fit.style.height = (1140 * k) + 'px';
  }
  function start() { drawLinks(); overview(); resize(); play(); }
  start();
  window.addEventListener('resize', resize);
})();
</script>
</body></html>
